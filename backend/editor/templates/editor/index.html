{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exam Paper Editor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<link rel="stylesheet" href="{% static 'editor/editor.css' %}">
</head>
<body>

<div id="toolbar">
  <input type="text" id="examTitle" placeholder="Exam paper title">
  <div class="sep"></div>

  <button data-cmd="bold"><b>B</b></button>
  <button data-cmd="italic"><i>I</i></button>
  <button data-cmd="underline"><u>U</u></button>
  <div class="sep"></div>

  <button data-cmd="justifyLeft">Left</button>
  <button data-cmd="justifyCenter">Center</button>
  <button data-cmd="justifyRight">Right</button>
  <div class="sep"></div>

  <button id="btnTable">Table</button>
  <button id="btnImage">Image</button>
  <input type="file" id="fileInput" accept="image/*" hidden>
  <button id="btnSymbol">Symbol</button>
  <button id="btnEquation">Equation</button>
  <button id="btnSymbolLibrary">📚 Library</button>
  <div class="sep"></div>

  <button id="btnAddPage">+ Page</button>
  <button id="btnNew">New</button>
  <select id="paperSelect"><option value="">-- saved exam papers --</option></select>
  <button id="btnLoad">Load</button>
  <button id="btnSave">Save</button>
  <span id="statusMsg"></span>
</div>

<div id="symbolPalette" hidden></div>

<!-- Mode Toggle -->
<div class="mode-toggle">
  <button id="btnFreeFormMode" class="active">Free-form Pages</button>
  <button id="btnStructuredMode">Structured Questions</button>
</div>

<!-- Symbol Library Sidebar -->
<div id="symbolLibrary" hidden>
  <div class="symbol-library-header">
    <h3>Symbol Library</h3>
    <button id="btnCloseSymbolLibrary">×</button>
  </div>
  <input type="text" id="symbolSearch" placeholder="Search symbols...">
  <div class="symbol-categories">
    <button data-category="">All</button>
    <button data-category="greek">Greek</button>
    <button data-category="math-ops">Math Ops</button>
    <button data-category="fractions">Fractions</button>
    <button data-category="powers">Powers</button>
    <button data-category="calculus">Calculus</button>
    <button data-category="vectors">Vectors</button>
    <button data-category="trig">Trig</button>
    <button data-category="phys">Physics</button>
    <button data-category="chem">Chemistry</button>
    <button data-category="units">Units</button>
  </div>
  <div id="symbolLibraryContent"></div>
</div>

<!-- Free-form Pages Container (existing) -->
<div id="pages"></div>

<!-- Structured Questions Container (new) -->
<div id="structuredQuestionsContainer" hidden>
  <div id="structuredQuestions"></div>
  <button id="btnAddQuestion" type="button">+ Add Question</button>
</div>

<script>
  // Backend and frontend are served by the same Django app, so the API
  // is always same-origin — plain relative paths, no CORS setup needed.
  const API_BASE = "";
</script>
<script src="{% static 'editor/editor.js' %}"></script>
</body>
</html>
